{% extends "base.html" %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-20">

    <div class="text-center mb-10">
        <h1 class="font-display text-3xl font-black tracking-wider text-silver-200 frost-glow">
            Player Login
        </h1>
        <p class="mt-2 text-sm text-ice-300/50 tracking-wider">
            Enter the tavern.
        </p>
    </div>

    {% if error %}
    <div class="mb-6 px-4 py-3 border border-red-700/40 bg-red-900/20 text-red-300 text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form action="/tavern/login" method="POST" class="space-y-6">
        <div>
            <label for="username" class="block text-[10px] tracking-widest uppercase text-silver-400/70 mb-1">
                Username
            </label>
            <input type="text" id="username" name="username" required autofocus
                   class="w-full px-4 py-2.5 bg-frost-800/60 border border-frost-700 text-silver-200 focus:border-ice-500/60 focus:outline-none transition-colors">
        </div>

        <div>
            <label for="password" class="block text-[10px] tracking-widest uppercase text-silver-400/70 mb-1">
                Password
            </label>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-2.5 bg-frost-800/60 border border-frost-700 text-silver-200 focus:border-ice-500/60 focus:outline-none transition-colors">
        </div>

        <button type="submit"
                class="w-full px-6 py-2.5 border border-ice-500/60 bg-ice-500/10 text-ice-300 hover:bg-ice-500/20 hover:border-ice-300 font-display text-sm tracking-widest uppercase transition-colors">
            Enter
        </button>
    </form>

</section>
{% endblock %}
